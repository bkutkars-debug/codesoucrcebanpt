name: CodeRescue AI - PR Code Audit

on:
  pull_request:
    paths:
      - '**/*.py'
  workflow_dispatch:

jobs:
  audit-ai-boilerplate-and-security:
    name: Audit AI Boilerplate & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get Changed Python Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.py'

      - name: Run CodeRescue AI Audit
        id: run-audit
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Auditing $file with CodeRescue AI..."
            python coderescue_cli.py "$file" > audit_output.md
          done

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('audit_output.md')) {
              const body = fs.readFileSync('audit_output.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
